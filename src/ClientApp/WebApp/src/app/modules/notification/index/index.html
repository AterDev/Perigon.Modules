<section class="page">
  <div
    class="d-flex align-items-center justify-content-between gap-3 page-heading"
  >
    <h2>{{ i18nKeys.notification.title | translate }}</h2>
    <button mat-stroked-button (click)="refresh()">
      <mat-icon>refresh</mat-icon>{{ i18nKeys.common.retry | translate }}
    </button>
  </div>

  <mat-tab-group
    [preserveContent]="true"
    (selectedIndexChange)="activeTab.set($event)"
  >
    <mat-tab [label]="i18nKeys.notification.notifications | translate">
      <ng-template matTabContent><app-notification-messages /></ng-template>
    </mat-tab>
    <mat-tab [label]="i18nKeys.notification.sources | translate">
      <ng-template matTabContent><app-notification-sources /></ng-template>
    </mat-tab>
    <mat-tab [label]="i18nKeys.notification.receivers | translate">
      <ng-template matTabContent><app-notification-receivers /></ng-template>
    </mat-tab>
    <mat-tab [label]="i18nKeys.notification.rules | translate">
      <ng-template matTabContent><app-notification-rules /></ng-template>
    </mat-tab>
    <mat-tab [label]="i18nKeys.notification.events | translate">
      <ng-template matTabContent><app-notification-events /></ng-template>
    </mat-tab>
    <mat-tab [label]="i18nKeys.notification.deliveries | translate">
      <ng-template matTabContent><app-notification-deliveries /></ng-template>
    </mat-tab>
  </mat-tab-group>
</section>
