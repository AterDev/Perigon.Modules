<h3 mat-dialog-title>{{data.title}}
</h3>
<mat-dialog-content>
  <span>
    {{data.content}}
  </span>
</mat-dialog-content>
<mat-dialog-actions class="justify-content-end">
  <button mat-button mat-dialog-close>{{ i18nKeys.common.cancel | translate }}</button>
  <button mat-button (click)="confirm()" color="primary">
    {{ i18nKeys.common.confirm | translate }}
  </button>
    </mat-dialog-actions>
